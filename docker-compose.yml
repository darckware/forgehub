services:
  forgehub-backend:
    build:
      context: ./backend
    container_name: forgehub-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # .env's POSTGRES_HOST/PORT (localhost:5433) are for host-side dev,
      # where the DB is reached via its published port. Inside this
      # container, "localhost" is the container itself -- reach Postgres
      # via its container name on the shared foundation_network, on its
      # internal port. These override the env_file values
      # (docker-compose `environment:` wins over `env_file:`).
      POSTGRES_HOST: company_postgres
      POSTGRES_PORT: "5432"
      # .env carries the host path (/root/messages) so ./dev.sh and pytest
      # write somewhere real; inside the container that same directory is
      # bind-mounted at /messages.
      MESSAGE_ATTACHMENTS_ROOT: /messages
      # Same host-vs-container-network split as above, for the other
      # Postgres instance (Hindsight/Foundation data, port 5433->5432).
      FOUNDATION_POSTGRES_HOST: foundation_postgres
      # The real Hermes agents (Athos, Atlas, ...) only exist as host
      # processes -- this container reaches them through the chat bridge
      # (host-bridge/app.py) running directly on the host, via the
      # extra_hosts entry below.
      CHAT_BRIDGE_URL: http://host.docker.internal:8910
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Read-write: backs ForgeHub's collective Knowledge Base interface
      # (api/routes/vault.py), including per-agent inboxes and shared review.
      # Obsidian may edit the same host Markdown as a complementary client.
      - /root/.hermes/knowledge_base:/vault
      - /root/.hermes/profiles:/profiles
      - /root/.hermes/foundation/governance:/governance:ro
      - /root/.hermes/foundation/agents:/foundation-agents:ro
      # Read-write: backs the Foundation rules browser/editor
      # (api/routes/foundation_docs.py) -- this is the actual rule set the
      # Hermes agents operate under, so every read/write there resolves
      # against this root and is restricted to .md files only.
      - /root/.hermes/foundation:/foundation-root
      # Read-write: the Docs "área de criação" (api/routes/docs.py) --
      # personal markdown docs, uploads and whiteboard assets, cross-linked
      # to Planning entities from the Docs page.
      - /root/docs:/docs
      # Read-write: files attached to a message (api/routes/demand.py's
      # upload handler). Kept out of /docs on purpose -- these are message
      # payloads, not documents in the browsable Docs tree.
      - /root/messages:/messages
      # Read-write: the WHOLE host filesystem, backing multiple
      # user-configurable "áreas de criação" (docs_creation_areas table,
      # api/routes/docs.py's /areas endpoints) -- any absolute host path
      # can be registered as a browsable/editable area, not just /root/docs.
      # Deliberately broad per explicit user confirmation (2026-07-08):
      # the backend can read/write anywhere on the host through this API,
      # including /etc, /home, /var, and ForgeHub's own /root/project
      # source (its .git included). Treat any Docs-domain path-handling
      # bug as host-filesystem-wide, not container-scoped.
      - /:/host-root
      # Crons/Scripts control pages (api/routes/foundation.py,
      # api/routes/cron_scripts.py) read everything through the /profiles
      # mount above: since hermes moved cron back to per-profile stores
      # (upstream issue #4707) each profile owns <profile>/cron/jobs.json,
      # <profile>/cron/logs/ (execution logs) and <profile>/scripts/. The
      # old central dirs (/root/.hermes/crons, /root/.hermes/scripts) were
      # migrated into the athos profile on 2026-07-06 and removed.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      - foundation_network

  forgehub-frontend:
    build:
      context: ./frontend
    container_name: forgehub-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      forgehub-backend:
        condition: service_healthy
    networks:
      # Same network as the backend — nginx proxies /api to
      # http://forgehub-backend:8000 by container name, so both must share it.
      - foundation_network

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      HINDSIGHT_API_DATABASE_BACKEND: postgresql
      HINDSIGHT_API_DATABASE_URL: postgresql://foundation:${POSTGRES_PASSWORD}@foundation_postgres:5432/foundation
      HINDSIGHT_API_READ_DATABASE_URL: postgresql://foundation:${POSTGRES_PASSWORD}@foundation_postgres:5432/foundation
      HINDSIGHT_API_MIGRATION_DATABASE_URL: postgresql://foundation:${POSTGRES_PASSWORD}@foundation_postgres:5432/foundation
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: http://forgerouter:2100/v1
      HINDSIGHT_API_LLM_MODEL: forgerouter/auto
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_WAIT_FOR_DEPS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8888:8888"
    networks:
      - foundation_network

networks:
  # Single shared network with the Postgres instances / Kanboard / Hindsight.
  # Renamed from hermes_foundation_pg_default on 2026-07-03; created manually
  # (docker network create foundation_network) and external in every project.
  # ForgeHub deliberately has no project-default network (removed 2026-07-03).
  foundation_network:
    external: true
