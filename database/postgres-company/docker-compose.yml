services:
  forgehub_postgres:
    image: pgvector/pgvector:pg16
    container_name: ${CONTAINER_NAME:-forgehub_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation_company}
      POSTGRES_USER: ${POSTGRES_USER:-foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundation_local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - forgehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundation} -d ${POSTGRES_DB:-foundation_company}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      # Only the shared foundation_network — the project-default network this
      # compose used to create (postgres-company_default) was redundant (no
      # other container ever joined it) and was removed on 2026-07-03.
      foundation_network:
        aliases:
          - forgehub_postgres

volumes:
  forgehub_postgres_data:
    name: forgehub_postgres_data

networks:
  # Renamed from hermes_foundation_pg_default on 2026-07-03 (created manually,
  # external in every project that uses it).
  foundation_network:
    external: true

# Compatibilidade: a topologia completa é gerenciada por ../docker-compose.yml.
