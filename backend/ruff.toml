# Python linter (ruff) — run from backend/: `ruff check app`
# Scope deliberately narrow: F (pyflakes: unused imports/variables, undefined
# names) + B904 (raise ... from inside except). Widen only with team buy-in.
target-version = "py313"

# Autogenerated migration files keep Alembic's template imports as-is.
extend-exclude = ["alembic/versions"]

[lint]
select = ["F", "B904"]
