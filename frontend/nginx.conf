server {
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy -- lets the SPA call /api/... with no base URL
    # baked in at build time (see src/lib/api.ts), so the same image works
    # whether it's loaded from localhost, a LAN IP, or a Cloudflare tunnel
    # hostname. Covers the terminal websocket and chat's streaming responses
    # too, both of which live under /api/.
    location /api/ {
        proxy_pass http://forgehub-backend:8000;
        proxy_http_version 1.1;
        # nginx defaults to 1MB, which silently capped every upload made
        # through the SPA (message attachments, docs, artifacts) at a tenth
        # of what the backend accepts -- the browser got a 413 from nginx and
        # the request never reached FastAPI, so the app's own 50MB limit and
        # its error message were unreachable. Keep this aligned with
        # demand.py's MAX_ATTACHMENT_BYTES (50MiB), with headroom: a multipart
        # body is the file plus boundary/header overhead, so matching the two
        # numbers exactly would make nginx reject a just-under-the-limit file
        # with its own bare 413 instead of letting the app answer with the
        # explanation. The app stays the one enforcing the rule.
        client_max_body_size 60m;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A terminal websocket or an in-progress LLM stream can sit idle far
        # longer than nginx's 60s default read timeout.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        # Chat responses stream token by token -- nginx's default response
        # buffering would hold chunks back until the buffer fills.
        proxy_buffering off;
    }

    # Vite content-hashes JS/CSS filenames (index-<hash>.js), so those can
    # cache forever -- but index.html references those hashed names, and
    # without an explicit no-cache here, browsers/proxies can hold onto a
    # stale index.html and never even find out a new deploy exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
