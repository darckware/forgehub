# forgehub_test_gateway (test-env/docker-compose.yml): the host's only way
# into forgehub_test_network, which is `internal` and so publishes no port.
# Plain TCP forwarding, 127.0.0.1 only, to the fixed addresses the compose
# file assigns. Nothing here dials anything but these four.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    log_format gw '$remote_addr [$time_local] $server_port -> $upstream_addr $status $bytes_sent/$bytes_received';
    access_log /dev/stdout gw;

    server {
        listen 127.0.0.1:5439;
        proxy_pass 172.25.0.10:5432;
    }
    server {
        listen 127.0.0.1:8002;
        proxy_pass 172.25.0.11:8000;
    }
    server {
        listen 127.0.0.1:4174;
        proxy_pass 172.25.0.12:4173;
        # Chat/terminal streams sit idle for minutes.
        proxy_timeout 1d;
    }
    server {
        # T.3: the integration stub, for dev.sh's backend and /_stub/calls.
        listen 127.0.0.1:8003;
        proxy_pass 172.25.0.13:8900;
    }
}
