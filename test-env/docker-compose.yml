# Isolated test Postgres for ForgeHub (Plano Integrado T.1, 2026-10-28).
#
# Own container, volume, network, port and credential -- nothing here is
# shared with production (`forgehub_postgres` :5433 on foundation_network).
# It is deliberately NOT on foundation_network: nothing in this stack can
# reach a production container by name, and no production container can
# reach this one.
#
#   docker compose -f test-env/docker-compose.yml up -d --wait
#
# T.2 (2026-10-28) adds the test app -- forgehub_test_backend and
# forgehub_test_frontend -- and makes forgehub_test_network `internal`: no
# route out of it at all (internet, host services such as the host-bridge on
# 8910, other containers). Docker publishes no port from an internal network,
# so the host reaches the stack through forgehub_test_gateway, an nginx
# `stream` proxy on the host network that listens on 127.0.0.1 only and
# forwards each port to a fixed address inside the network:
#
#   127.0.0.1:5439 -> forgehub_test_postgres  172.25.0.10:5432  (dev.sh, pytest, reset.sh)
#   127.0.0.1:8002 -> forgehub_test_backend   172.25.0.11:8000
#   127.0.0.1:4174 -> forgehub_test_frontend  172.25.0.12:4173
#   127.0.0.1:8003 -> forgehub_test_stubs     172.25.0.13:8900  (T.3: integration stub + its call log)
#
# The gateway only forwards inbound connections; nothing inside the network
# can use it to get out (it is not their route, and it only dials those
# three fixed addresses).
#
# T.3 (2026-10-29) adds forgehub_test_stubs: every external integration the
# backend has (host-bridge -- agent runs, Telegram/cross-channel messages,
# servers, files, ForgeVault --, Darckware and its e-mail queue, ForgeRouter,
# Tailscale, weather) points at it, and under ENVIRONMENT=test config.py
# refuses to start with any other target or with a production credential.
# The stub records each call (no content) on its own volume,
# forgehub_test_stublog; list them with
#   curl -s http://127.0.0.1:8003/_stub/calls
#
# The password comes from test-env/.env.test (out of git; template in
# .env.test.example). DB name and user are fixed here, not read from the
# file, so the container can't be pointed at another database by an edit.
name: forgehub-test

services:
  forgehub_test_postgres:
    image: pgvector/pgvector:pg16
    container_name: forgehub_test_postgres
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      POSTGRES_DB: forgehub_test
      POSTGRES_USER: forgehub_test
    # No `ports:` -- published through forgehub_test_gateway (see header).
    volumes:
      - forgehub_test_pgdata:/var/lib/postgresql/data
      # Migrations assume the `company` schema already exists (alembic/env.py).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      forgehub_test_network:
        ipv4_address: 172.25.0.10
    # Limits are set before the container exists: lack of resources must
    # stop provisioning, never fall back to the production instance.
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehub_test -d forgehub_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The test backend. ENVIRONMENT=test: app/core/config.py loads only
  # test-env/.env.test (no production .env exists in this image or mount),
  # refuses any database off the test allowlist, and turns the background
  # loops off (BACKGROUND_WORKERS_ENABLED is ignored under test). It reaches
  # Postgres by container name -- the allowlist's in-network entry -- since
  # 127.0.0.1 inside this container is the container itself.
  forgehub_test_backend:
    build:
      context: ../backend
    image: forgehub-test-backend:local
    container_name: forgehub_test_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: test
      POSTGRES_HOST: forgehub_test_postgres
      POSTGRES_PORT: "5432"
      # Every integration goes to the stub, by its in-network name (T.3).
      # .env.test holds the host addresses (127.0.0.1:8003, through the
      # gateway) for dev.sh; these override them inside the network.
      CHAT_BRIDGE_URL: http://forgehub_test_stubs:8900
      DARCKWARE_API_URL: http://forgehub_test_stubs:8900/darckware
      FORGEROUTER_URL: http://forgehub_test_stubs:8900/forgerouter
      TAILSCALE_API_URL: http://forgehub_test_stubs:8900/tailscale
      WEATHER_API_URL: http://forgehub_test_stubs:8900/weather
      WEATHER_REVERSE_GEOCODE_URL: http://forgehub_test_stubs:8900/weather
    volumes:
      # config.py resolves test-env/.env.test from the repo root, which is
      # "/" for the code at /app. The other file is the salted hashes of the
      # production secrets (init-env.sh), so the credential check has
      # something to compare against without the production .env.
      - ./.env.test:/test-env/.env.test:ro
      - ./.prod-secret-hashes:/test-env/.prod-secret-hashes:ro
    networks:
      forgehub_test_network:
        ipv4_address: 172.25.0.11
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      forgehub_test_postgres:
        condition: service_healthy
      forgehub_test_stubs:
        condition: service_healthy

  # Integration stub (T.3, backend/app/tests/fixtures/integration_stub.py):
  # answers in place of the host-bridge, Darckware, ForgeRouter, Tailscale
  # and weather services, never reaches any of them (the network has no route
  # out), and writes one line per call to /stub-log/calls.jsonl. It loads the
  # same Settings as the backend, so it checks the test tokens and refuses to
  # start under the same rules.
  forgehub_test_stubs:
    build:
      context: ../backend
    image: forgehub-test-backend:local
    container_name: forgehub_test_stubs
    restart: unless-stopped
    command: ["uvicorn", "app.tests.fixtures.integration_stub:app", "--host", "0.0.0.0", "--port", "8900"]
    environment:
      ENVIRONMENT: test
      POSTGRES_HOST: forgehub_test_postgres
      POSTGRES_PORT: "5432"
      CHAT_BRIDGE_URL: http://forgehub_test_stubs:8900
      DARCKWARE_API_URL: http://forgehub_test_stubs:8900/darckware
      FORGEROUTER_URL: http://forgehub_test_stubs:8900/forgerouter
      TAILSCALE_API_URL: http://forgehub_test_stubs:8900/tailscale
      WEATHER_API_URL: http://forgehub_test_stubs:8900/weather
      WEATHER_REVERSE_GEOCODE_URL: http://forgehub_test_stubs:8900/weather
    volumes:
      - ./.env.test:/test-env/.env.test:ro
      - ./.prod-secret-hashes:/test-env/.prod-secret-hashes:ro
      - forgehub_test_stublog:/stub-log
    networks:
      forgehub_test_network:
        ipv4_address: 172.25.0.13
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/_stub/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The test frontend: the production image's build, with an nginx config
  # whose /api goes to forgehub_test_backend -- the production one proxies to
  # forgehub-backend by container name, which doesn't resolve here.
  forgehub_test_frontend:
    build:
      context: ../frontend
    image: forgehub-test-frontend:local
    container_name: forgehub_test_frontend
    restart: unless-stopped
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      forgehub_test_network:
        ipv4_address: 172.25.0.12
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      forgehub_test_backend:
        condition: service_healthy

  # Host-side door into the internal network (see header). Host network, so
  # its listeners are on the host itself -- bound to 127.0.0.1 only.
  forgehub_test_gateway:
    image: nginx:1.27-alpine
    container_name: forgehub_test_gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./gateway-nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5439"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off runner for the backend's own tooling against the test database
  # (alembic, pytest, reset), for hosts without backend/.venv:
  #   docker compose -f test-env/docker-compose.yml run --rm tools alembic upgrade head
  #   docker compose -f test-env/docker-compose.yml run --rm tools pytest
  # Profile-gated, so `up` never starts it. Host networking only so it
  # reaches the database exactly as a host process does (127.0.0.1:5439,
  # the allowlisted target); it gets no production .env -- the repo root
  # isn't mounted -- and ENVIRONMENT=test makes app/core/config.py refuse
  # any other target before connecting.
  tools:
    profiles: ["tools"]
    build:
      context: ../backend
    image: forgehub-test-tools:local
    network_mode: host
    working_dir: /app
    environment:
      ENVIRONMENT: test
    volumes:
      - ../backend:/app
      # config.py resolves test-env/.env.test from the repo root, which is
      # "/" for the code mounted at /app.
      - ./.env.test:/test-env/.env.test:ro
      - ./.prod-secret-hashes:/test-env/.prod-secret-hashes:ro
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      forgehub_test_postgres:
        condition: service_healthy
      forgehub_test_gateway:
        condition: service_healthy

volumes:
  forgehub_test_pgdata:
    name: forgehub_test_pgdata
  forgehub_test_stublog:
    name: forgehub_test_stublog

networks:
  forgehub_test_network:
    name: forgehub_test_network
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/16
